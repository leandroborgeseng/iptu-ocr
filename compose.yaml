services:
  iptu:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET: ${APP_SECRET:?Defina APP_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      DETECTOR_WORKERS: ${DETECTOR_WORKERS:-3}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-100}
      UPLOAD_MAX_BATCH_MB: ${UPLOAD_MAX_BATCH_MB:-65536}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-20000}
    volumes:
      - iptu-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  iptu-data:
